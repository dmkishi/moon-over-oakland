name: Image

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Rebuild picks up base image patches every Monday at 12:00/1:00 PM PST/PDT
    - cron: '0 20 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  TEST_IMAGE: moon-over-oakland:test
  FULL_MOON_DATE: '2026-01-02'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - name: Build for test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          pull: true
          build-args: |
            NODE_VERSION=${{ steps.node.outputs.version }}
            GIT_REVISION=${{ github.sha }}
          tags: ${{ env.TEST_IMAGE }}

      - name: Smoke test
        run: docker run --rm "$TEST_IMAGE" --dry-run "$FULL_MOON_DATE"

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          build-args: |
            NODE_VERSION=${{ steps.node.outputs.version }}
            GIT_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
