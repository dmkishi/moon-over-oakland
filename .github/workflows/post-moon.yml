name: Post Moon (If Phase Is Permitted)

on:
  schedule:
    # Run daily at 6 AM PST / 7 AM PDT (1 PM UTC)
    - cron: '0 13 * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without posting'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  check-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check moon phase and post
        run: pnpm post
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          TIMEZONE: ${{ vars.TIMEZONE || 'America/Los_Angeles' }}
          LATITUDE: ${{ vars.LATITUDE || '37.8044' }}
          LONGITUDE: ${{ vars.LONGITUDE || '-122.2712' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
